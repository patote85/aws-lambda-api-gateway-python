name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        # moto mocks DynamoDB — no AWS credentials required
        run: PYTHONPATH=. pytest tests/test_exclusao.py -v

  synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cdk/requirements.txt

      - name: Install CDK Python deps
        run: pip install -r cdk/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: CDK synth
        # No AWS credentials — synth only, never deploy
        run: npx --yes aws-cdk@2 synth
