[project]
name = "aws-lambda-api-gateway-python"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["lambda", "tests", "cdk"]

[tool.ruff.lint]
# Hard constraints (Lauren/pstack): errors + unused. Import-sort (I) deferred —
# CDK multi-alias imports fight isort without value; enable in a later PR.
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
# `lambda/` is a reserved package name; CDK stubs are heavy — typecheck tests only for now.
files = ["tests"]

[[tool.mypy.overrides]]
module = "lambda.*"
ignore_errors = true
