[project]
name = "aws-lambda-api-gateway-python"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["lambda", "tests", "cdk"]

[tool.ruff.lint]
# Hard constraints (Lauren/pstack): errors + unused + timezone-aware datetimes.
# DTZ bans naive utcnow/utcfromtimestamp (DTZ003 etc.). Import-sort (I) deferred —
# CDK multi-alias imports fight isort without value; enable in a later PR.
# CORS AllowOrigins "*" is already avoided in cdk/app.py (localhost only) —
# do not reintroduce wildcard origins in CDK.
select = ["E", "F", "W", "DTZ"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
# Typecheck tests + domain_dynamo (HTTP app.py stays out — Powertools resolver cost).
# No ignore_errors on domain.
files = ["tests", "lambda/domain_dynamo.py"]
